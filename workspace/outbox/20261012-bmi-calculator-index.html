<!-- Catatan serah-terima: Membuat aplikasi kalkulator BMI mandiri berantarmuka bahasa Indonesia (HTML/CSS/JS dalam satu berkas) dengan validasi masukan; rumus dan kategori BMI sesuai spesifikasi; aplikasi siap langsung dibuka dan digunakan di browser. -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator BMI</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --kurus: #0284c7;
      --normal: #16a34a;
      --kelebihan: #ea580c;
      --obesitas: #dc2626;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
      --error-border: #fecaca;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      padding: 32px 28px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 48px 12px 14px;
      font-size: 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .unit-badge {
      position: absolute;
      right: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      pointer-events: none;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-submit {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-reset {
      background-color: #f1f5f9;
      color: #475569;
    }

    .btn-reset:hover {
      background-color: #e2e8f0;
    }

    .alert {
      display: none;
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .result-card {
      display: none;
      margin-top: 24px;
      padding: 20px;
      background-color: #f8fafc;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .result-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .bmi-value {
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .category-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .category-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .reference-table {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }

    .reference-table h2 {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-align: center;
      font-weight: 600;
    }

    .ref-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 2px;
    }

    .ref-item:nth-child(even) {
      background-color: #f8fafc;
    }

    .ref-kurus { color: var(--kurus); }
    .ref-normal { color: var(--normal); }
    .ref-kelebihan { color: var(--kelebihan); }
    .ref-obesitas { color: var(--obesitas); }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Kalkulator BMI</h1>
      <p>Hitung Indeks Massa Tubuh Anda</p>
    </header>

    <form id="bmiForm" onsubmit="hitungBMI(event)">
      <div class="form-group">
        <label for="beratInput">Berat Badan</label>
        <div class="input-wrapper">
          <input 
            type="number" 
            id="beratInput" 
            placeholder="Contoh: 70" 
            step="any"
            autocomplete="off"
            required
          >
          <span class="unit-badge">kg</span>
        </div>
      </div>

      <div class="form-group">
        <label for="tinggiInput">Tinggi Badan</label>
        <div class="input-wrapper">
          <input 
            type="number" 
            id="tinggiInput" 
            placeholder="Contoh: 175" 
            step="any"
            autocomplete="off"
            required
          >
          <span class="unit-badge">cm</span>
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-submit">Hitung BMI</button>
        <button type="button" class="btn-reset" onclick="resetForm()">Reset</button>
      </div>
    </form>

    <div id="errorAlert" class="alert" role="alert"></div>

    <section id="resultCard" class="result-card" aria-live="polite">
      <div class="result-title">Hasil BMI Anda</div>
      <div id="bmiValue" class="bmi-value">--</div>
      <div id="categoryBadge" class="category-badge">--</div>
      <p id="categoryDesc" class="category-desc"></p>
    </section>

    <section class="reference-table">
      <h2>Kategori BMI Standar:</h2>
      <div class="ref-item">
        <span>Kurus</span>
        <span class="ref-kurus">&lt; 18.5</span>
      </div>
      <div class="ref-item">
        <span>Normal</span>
        <span class="ref-normal">18.5 – 24.9</span>
      </div>
      <div class="ref-item">
        <span>Kelebihan berat badan</span>
        <span class="ref-kelebihan">25.0 – 29.9</span>
      </div>
      <div class="ref-item">
        <span>Obesitas</span>
        <span class="ref-obesitas">&ge; 30.0</span>
      </div>
    </section>
  </main>

  <script>
    const beratInput = document.getElementById('beratInput');
    const tinggiInput = document.getElementById('tinggiInput');
    const errorAlert = document.getElementById('errorAlert');
    const resultCard = document.getElementById('resultCard');
    const bmiValueEl = document.getElementById('bmiValue');
    const categoryBadgeEl = document.getElementById('categoryBadge');
    const categoryDescEl = document.getElementById('categoryDesc');

    function showError(message) {
      errorAlert.textContent = message;
      errorAlert.style.display = 'block';
      resultCard.style.display = 'none';
    }

    function clearError() {
      errorAlert.textContent = '';
      errorAlert.style.display = 'none';
    }

    function hitungBMI(event) {
      if (event) event.preventDefault();
      clearError();

      const beratStr = beratInput.value.trim();
      const tinggiStr = tinggiInput.value.trim();

      if (!beratStr || !tinggiStr) {
        showError('Silakan masukkan berat badan dan tinggi badan terlebih dahulu.');
        return;
      }

      const berat = parseFloat(beratStr);
      const tinggi = parseFloat(tinggiStr);

      if (isNaN(berat) || isNaN(tinggi)) {
        showError('Nilai yang dimasukkan harus berupa angka.');
        return;
      }

      if (tinggi <= 0 || berat <= 0) {
        showError('Tinggi dan berat badan harus berupa angka positif lebih dari nol.');
        return;
      }

      if (tinggi < 50 || tinggi > 300) {
        showError('Tinggi badan tidak wajar. Masukkan nilai antara 50 cm hingga 300 cm.');
        return;
      }

      if (berat < 10 || berat > 500) {
        showError('Berat badan tidak wajar. Masukkan nilai antara 10 kg hingga 500 kg.');
        return;
      }

      // Rumus: BMI = berat (kg) / tinggi (m)²
      const tinggiMeter = tinggi / 100;
      const bmi = berat / (tinggiMeter * tinggiMeter);
      const bmiFormatted = bmi.toFixed(1);

      let kategori = '';
      let warna = '';
      let keterangan = '';

      if (bmi < 18.5) {
        kategori = 'Kurus';
        warna = 'var(--kurus)';
        keterangan = 'Berat badan Anda berada di bawah rentang normal. Disarankan untuk mencukupi asupan gizi seimbang.';
      } else if (bmi < 25) {
        kategori = 'Normal';
        warna = 'var(--normal)';
        keterangan = 'Selamat! Berat badan Anda berada dalam kategori ideal dan sehat.';
      } else if (bmi < 30) {
        kategori = 'Kelebihan berat badan';
        warna = 'var(--kelebihan)';
        keterangan = 'Berat badan Anda melebihi batas normal. Disarankan untuk menjaga pola makan dan aktif berolahraga.';
      } else {
        kategori = 'Obesitas';
        warna = 'var(--obesitas)';
        keterangan = 'Berat badan Anda berada dalam kategori obesitas. Disarankan untuk berkonsultasi dengan tenaga kesehatan.';
      }

      bmiValueEl.textContent = bmiFormatted;
      bmiValueEl.style.color = warna;
      categoryBadgeEl.textContent = kategori;
      categoryBadgeEl.style.backgroundColor = warna;
      categoryDescEl.textContent = keterangan;

      resultCard.style.display = 'block';
    }

    function resetForm() {
      beratInput.value = '';
      tinggiInput.value = '';
      clearError();
      resultCard.style.display = 'none';
      beratInput.focus();
    }
  </script>
</body>
</html>
